<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>My Life Tracker</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tracker">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#10b981">
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{--bg:#f3f4f6;--card:#fff;--text:#111827;--sub:#6b7280;--border:#e5e7eb;--green:#10b981;--rose:#f43f5e;--pink:#fda4af;--amber:#f59e0b;}
@media(prefers-color-scheme:dark){:root{--bg:#0a0a0a;--card:#1a1a1a;--text:#f3f4f6;--sub:#9ca3af;--border:#2a2a2a;}}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding:20px 16px 120px;max-width:500px;margin:0 auto;padding-top:env(safe-area-inset-top,20px);}
h1{font-size:28px;font-weight:800;letter-spacing:-0.5px;}
.date{color:var(--sub);font-size:15px;margin-top:2px;margin-bottom:24px;}
.card{background:var(--card);border-radius:20px;padding:20px;margin-bottom:16px;border:1px solid var(--border);}
.card-title{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.battery-wrap{position:relative;height:44px;background:var(--border);border-radius:12px;overflow:hidden;cursor:pointer;touch-action:none;}
.battery-fill{height:100%;border-radius:12px;transition:width 0.1s,background 0.3s;display:flex;align-items:center;justify-content:flex-end;padding-right:12px;font-size:14px;font-weight:800;color:#fff;min-width:40px;}
.emoji-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
.emoji-btn{aspect-ratio:1;border:2px solid var(--border);border-radius:14px;font-size:28px;background:var(--card);cursor:pointer;transition:all 0.15s;display:flex;align-items:center;justify-content:center;position:relative;}
.emoji-btn.active{border-color:var(--green);background:#ecfdf5;transform:scale(0.93);}
@media(prefers-color-scheme:dark){.emoji-btn.active{background:#064e3b;}}
.emoji-btn:active{transform:scale(0.9);}
.emoji-btn.custom{font-size:14px;font-weight:bold;color:var(--sub);}
.photo-btn{width:100%;padding:14px;border:2px dashed var(--border);border-radius:14px;background:transparent;color:var(--sub);font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
.photo-btn:active{background:var(--border);}
.photo-strip{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.photo-strip img{width:60px;height:60px;object-fit:cover;border-radius:10px;border:2px solid var(--border);}
.photo-strip .remove-photo{position:relative;}
.photo-strip .remove-x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;background:var(--rose);color:#fff;border:none;border-radius:50%;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.period-btns{display:flex;gap:8px;margin-bottom:16px;}
.period-btn{flex:1;padding:14px 8px;border:2px solid var(--border);border-radius:14px;background:var(--card);font-size:14px;font-weight:700;cursor:pointer;text-align:center;transition:all 0.15s;color:var(--text);}
.period-btn:active{transform:scale(0.95);}
.period-btn.sel-yes{border-color:var(--rose);background:#fff1f2;color:var(--rose);}
.period-btn.sel-spot{border-color:var(--pink);background:#fff1f2;color:#e11d48;}
.period-btn.sel-no{border-color:var(--green);background:#ecfdf5;color:var(--green);}
@media(prefers-color-scheme:dark){.period-btn.sel-yes,.period-btn.sel-spot{background:#4c0519;}.period-btn.sel-no{background:#064e3b;}}
.cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.cal-header span{font-size:13px;font-weight:700;color:var(--sub);}
.cal-header button{background:none;border:none;font-size:18px;cursor:pointer;color:var(--sub);padding:4px 8px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;}
.cal-day-name{font-size:10px;color:var(--sub);font-weight:600;padding:4px 0;}
.cal-day{font-size:12px;padding:6px 2px;border-radius:8px;position:relative;color:var(--text);}
.cal-day.today{font-weight:800;background:var(--border);}
.cal-day.empty{visibility:hidden;}
.cal-dot{width:5px;height:5px;border-radius:50%;position:absolute;bottom:2px;left:50%;transform:translateX(-50%);}
.dot-yes{background:var(--rose);}
.dot-spot{background:var(--pink);}
.save-btn{position:fixed;bottom:0;left:0;right:0;padding:16px;background:var(--bg);z-index:100;}
.save-btn button{width:100%;max-width:500px;margin:0 auto;display:block;padding:18px;background:var(--green);color:#fff;border:none;border-radius:16px;font-size:18px;font-weight:800;cursor:pointer;transition:all 0.15s;}
.save-btn button:active{transform:scale(0.97);opacity:0.9;}
.save-btn button.saved{background:#065f46;}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:var(--text);color:var(--bg);padding:12px 24px;border-radius:30px;font-size:14px;font-weight:700;transition:transform 0.3s;z-index:200;}
.toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<h1>My Day</h1>
<div class="date" id="todayDate"></div>

<div class="card">
  <div class="card-title">⚡ Energy</div>
  <div class="battery-wrap" id="batteryWrap">
    <div class="battery-fill" id="batteryFill" style="width:50%">50%</div>
  </div>
</div>

<div class="card">
  <div class="card-title">🍽️ What did you eat?</div>
  <div class="emoji-grid" id="emojiGrid"></div>
  <label class="photo-btn" for="photoInput">📷 Snap a photo</label>
  <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none">
  <div class="photo-strip" id="photoStrip"></div>
</div>

<div class="card">
  <div class="card-title">🩸 Period?</div>
  <div class="period-btns">
    <button class="period-btn" data-val="yes" onclick="setPeriod('yes')"> Yes</button>
    <button class="period-btn" data-val="spot" onclick="setPeriod('spot')">💧 Spotting</button>
    <button class="period-btn" data-val="no" onclick="setPeriod('no')">✨ No</button>
  </div>
  <div class="cal-header">
    <button onclick="changeMonth(-1)">‹</button>
    <span id="calTitle"></span>
    <button onclick="changeMonth(1)">›</button>
  </div>
  <div class="cal-grid" id="calGrid"></div>
</div>

<div class="save-btn"><button id="saveBtn" onclick="saveDay()">✓ Save My Day</button></div>
<div class="toast" id="toast">Saved! </div>

<canvas id="canvas" style="display:none"></canvas>

<script>
// ===== DATA =====
// Only using very common emojis so none of them show up as blank boxes!
const DEFAULT_FOODS = ['🥗','','🍕','🍎','','🍓','🍒','','🥑','🍞','','🍗','🍝','','🍣','🍦','','🍪','☕','','🍫','🌮','','🍛','🍚','','🥙','🥓','🥩','🍖','🥚','🥞','🧇','🥐','🥨','🥯','🥖','🥬','🥦','🫑','🥜','🌰','🧀','🍟','🌭','🥪','🌯','🥣','','🍙','🍡','','🦀','🦐','','🍨','🎂','🍰','🥧','🍭','🍮','🍼','🥛','🍵','🍷','🍹','','🧋'];
let customFoods = JSON.parse(localStorage.getItem('customFoods') || '[]');
let allFoods = [...DEFAULT_FOODS, ...customFoods];

const today = new Date();
const todayStr = today.toISOString().split('T')[0];
let calYear = today.getFullYear(), calMonth = today.getMonth();
let currentPhotos = [];

document.getElementById('todayDate').textContent = today.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});

// ===== ENERGY SLIDER =====
const wrap = document.getElementById('batteryWrap');
const fill = document.getElementById('batteryFill');
let energy = 50;

function setEnergy(pct) {
  energy = Math.max(5, Math.min(100, pct));
  fill.style.width = energy + '%';
  fill.textContent = energy + '%';
  if (energy < 30) fill.style.background = '#ef4444';
  else if (energy < 60) fill.style.background = '#f59e0b';
  else fill.style.background = '#10b981';
}
setEnergy(50);

function slideEnergy(e) {
  const rect = wrap.getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  setEnergy(Math.round((x / rect.width) * 100));
}
wrap.addEventListener('mousedown', e => { slideEnergy(e); const mv = e2 => slideEnergy(e2); document.addEventListener('mousemove', mv); document.addEventListener('mouseup', () => document.removeEventListener('mousemove', mv), {once:true}); });
wrap.addEventListener('touchstart', e => { slideEnergy(e); }, {passive:true});
wrap.addEventListener('touchmove', e => { slideEnergy(e); }, {passive:true});

// ===== FOOD EMOJIS =====
const grid = document.getElementById('emojiGrid');
let selectedFoods = [];

function renderFoods() {
  grid.innerHTML = '';
  allFoods.forEach((f, index) => {
    const btn = document.createElement('button');
    btn.className = 'emoji-btn';
    btn.textContent = f;
    if (selectedFoods.includes(f)) btn.classList.add('active');
    btn.onclick = () => {
      btn.classList.toggle('active');
      if (selectedFoods.includes(f)) selectedFoods = selectedFoods.filter(x=>x!==f);
      else selectedFoods.push(f);
    };
    grid.appendChild(btn);
  });
  
  // Add Custom Button
  const addBtn = document.createElement('button');
  addBtn.className = 'emoji-btn custom';
  addBtn.textContent = '➕ Add';
  addBtn.onclick = addCustomFood;
  grid.appendChild(addBtn);
}

function addCustomFood() {
  const emoji = prompt("Type an emoji (e.g. ) or food name:");
  if (emoji && emoji.trim() !== '') {
    if (!customFoods.includes(emoji.trim())) {
      customFoods.push(emoji.trim());
      localStorage.setItem('customFoods', JSON.stringify(customFoods));
      allFoods = [...DEFAULT_FOODS, ...customFoods];
      renderFoods();
    } else {
      alert("You already added that one!");
    }
  }
}

renderFoods();

// ===== PHOTOS =====
document.getElementById('photoInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    compressPhoto(ev.target.result, (compressed) => {
      currentPhotos.push(compressed);
      renderPhotos();
    });
  };
  reader.readAsDataURL(file);
  e.target.value = '';
});

function compressPhoto(dataUrl, cb) {
  const img = new Image();
  img.onload = () => {
    const c = document.getElementById('canvas');
    const max = 300;
    let w = img.width, h = img.height;
    if (w > h) { if (w > max) { h *= max/w; w = max; } }
    else { if (h > max) { w *= max/h; h = max; } }
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    cb(c.toDataURL('image/jpeg', 0.5));
  };
  img.src = dataUrl;
}

function renderPhotos() {
  const strip = document.getElementById('photoStrip');
  strip.innerHTML = currentPhotos.map((p, i) =>
    `<div class="remove-photo"><img src="${p}"><button class="remove-x" onclick="removePhoto(${i})">×</button></div>`
  ).join('');
}
function removePhoto(i) { currentPhotos.splice(i, 1); renderPhotos(); }

// ===== PERIOD =====
let periodVal = '';
function setPeriod(v) {
  periodVal = v;
  document.querySelectorAll('.period-btn').forEach(b => {
    b.className = 'period-btn';
    if (b.dataset.val === v) b.classList.add('sel-' + v);
  });
}

// ===== MINI CALENDAR =====
function renderCal() {
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('calTitle').textContent = months[calMonth] + ' ' + calYear;
  const g = document.getElementById('calGrid');
  g.innerHTML = '';
  ['S','M','T','W','T','F','S'].forEach(d => {
    const el = document.createElement('div');
    el.className = 'cal-day-name';
    el.textContent = d;
    g.appendChild(el);
  });
  const first = new Date(calYear, calMonth, 1).getDay();
  const days = new Date(calYear, calMonth + 1, 0).getDate();
  const logs = JSON.parse(localStorage.getItem('lifeLogs') || '{}');
  for (let i = 0; i < first; i++) { const el = document.createElement('div'); el.className = 'cal-day empty'; g.appendChild(el); }
  for (let d = 1; d <= days; d++) {
    const el = document.createElement('div');
    el.className = 'cal-day';
    el.textContent = d;
    const ds = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    if (ds === todayStr) el.classList.add('today');
    if (logs[ds] && logs[ds].period) {
      const dot = document.createElement('div');
      dot.className = 'cal-dot dot-' + (logs[ds].period === 'yes' ? 'yes' : 'spot');
      el.appendChild(dot);
    }
    g.appendChild(el);
  }
}
function changeMonth(dir) { calMonth += dir; if (calMonth > 11) { calMonth = 0; calYear++; } if (calMonth < 0) { calMonth = 11; calYear--; } renderCal(); }
renderCal();

// ===== SAVE =====
function saveDay() {
  const logs = JSON.parse(localStorage.getItem('lifeLogs') || '{}');
  const existing = logs[todayStr] || {};
  logs[todayStr] = {
    energy: energy,
    foods: selectedFoods,
    photos: (existing.photos || []).concat(currentPhotos),
    period: periodVal || existing.period || ''
  };
  try { localStorage.setItem('lifeLogs', JSON.stringify(logs)); } catch(e) { alert('Storage full! Too many photos.'); return; }
  currentPhotos = [];
  renderPhotos();
  const btn = document.getElementById('saveBtn');
  btn.textContent = '✓ Saved!';
  btn.classList.add('saved');
  setTimeout(() => { btn.textContent = '✓ Save My Day'; btn.classList.remove('saved'); }, 2000);
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
  loadToday();
  renderCal();
}

function loadToday() {
  const logs = JSON.parse(localStorage.getItem('lifeLogs') || '{}');
  const d = logs[todayStr];
  if (!d) return;
  if (d.energy) setEnergy(d.energy);
  if (d.foods) {
    selectedFoods = d.foods;
    renderFoods(); // Re-render to show active state
  }
  if (d.photos) { currentPhotos = d.photos; renderPhotos(); }
  if (d.period) setPeriod(d.period);
}
loadToday();

if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js')); }
</script>
</body>
</html>
